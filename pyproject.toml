# [build-system]
# requires=['hatchling']
# build-backend = "hatchling.build"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piidigger"
dynamic = ["version",]
authors = [
            {name="Randy Bartels", email="rjbartels@outlook.com"},
    ]
description = "Python program to identify Personally Identifiable Information in common file types"
readme = "README.md"
keywords = ["pii discovery", "data discovery", "credit card discovery"]
requires-python = ">=3.14,<4"
dependencies = ["charset-normalizer>=3.4,<4",
                "click>=8.1,<9",
                "colorama==0.4.6",
                "docx2python==3.6.2",
                "lxml>=6.0.0,<7",
                "openpyxl==3.1.5",
                "pydantic==2.13.4",
                "puremagic==2.2.0",
                "pypdf==6.13.2",
                "pyyaml==6.0.3",
                "rich>=13.7,<15",
                "wakepy==1.0.0",
                "xlrd==2.0.2",
                ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Utilities",
    ]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    ]
test = [
    "pytest>=7.4.4",
    ]
win = [
    "pywin32",
    ]
build = [
    "pyinstaller>=6.6.0",
    ]
pypi = [
    "build>=1.2.1",
    "twine>=5.0.0",
    ]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
    "mkdocs-autorefs>=1.0.0",
    "pymdown-extensions>=10.0.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-mermaid2-plugin>=1.2.1",
]

[project.scripts]
piidigger = "piidigger.piidigger:main"
getmime = "piidigger.getmime:main"

[tool.setuptools.dynamic]
version = {attr = "piidigger.__version__"}

[project.urls]
Homepage = "https://github.com/kirkpatrickprice/PIIDigger"
Issues = "https://github.com/kirkpatrickprice/PIIDigger/issues"

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
# E/F = pycodestyle+pyflakes, I = isort, UP = pyupgrade (enforces `X | None`),
# B = bugbear, S = flake8-bandit (replaces the old [tool.bandit] config).
# N (pep8-naming) is enabled for new code only; legacy modules are exempted
# below until the queue refactor renames them (dirsQ -> dirs_queue, etc.).
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Legacy camelCase files that have not been renamed yet (deleted in Phase 4).
# New packages (orchestration/, models/, cli/) are NOT exempted.
"src/piidigger/classes.py" = ["N"]
"src/piidigger/piidigger.py" = ["N"]
"src/piidigger/queuefuncs.py" = ["N"]
"src/piidigger/filescan.py" = ["N"]
"src/piidigger/logmanager.py" = ["N"]
"src/piidigger/__main__.py" = ["N"]
"piidigger.py" = ["N"]  # legacy repo-root PyInstaller entry wrapper
"tests/**" = ["S101", "S108", "S301", "N"]  # asserts, /tmp strings, and pickle are expected in tests
# Handler packages re-export submodules so the dynamic __dir__() discovery in
# globalfuncs can find them; the imports are intentional, not dead code.
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# mypy 2.x defaults are strict. Keep no-untyped-call off globally so freshly
# typed modules may still call into the (as yet) untyped legacy tree.
disable_error_code = ["no-untyped-call"]

# The legacy tree is largely unannotated and is being typed module-by-module as
# the queue refactor rewrites it. These modules are ignored for now; delete each
# entry as its module gains full type coverage. Modules NOT listed here
# (console, getencoding, future orchestration) are type-checked normally.
[[tool.mypy.overrides]]
module = [
    "piidigger.piidigger",
    "piidigger.run",
    "piidigger.__main__",
    "piidigger.classes",
    "piidigger.globalfuncs",
    "piidigger.filescan",
    "piidigger.queuefuncs",
    "piidigger.logmanager",
    "piidigger.getmime",
    "piidigger.filehandlers.*",
    "piidigger.outputhandlers.*",
    "piidigger.datahandlers.*",
]
ignore_errors = true

# New code is held to a strict standard.
[[tool.mypy.overrides]]
module = "piidigger.orchestration.*"
strict = true
enable_error_code = ["no-untyped-call"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# [tool.hatch.build.targets.wheel]
# packages = ["src/piidigger"]

[tool.pytest.ini_options]
pythonpath = "src/"
addopts = ["--import-mode=importlib",]
markers = [
    "datahandlers: mark a test as a data handler test",
    "filehandlers: mark a test as a file handler test",
    "unit: mark a test as a unit test",
    "utils: mark a test as a utility test",
    "slow: mark a test as slow (timeout/reliability tests)",
    "e2e: mark a test as an end-to-end test (full scan + baseline)",
    "integration: mark a test as an integration test (spins up real processes)",
    ]
