site_name: PIIDigger
site_description: Identify Personally Identifiable Information in common file types
repo_url: https://github.com/kirkpatrickprice/PIIDigger
repo_name: kirkpatrickprice/PIIDigger
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            docstring_style: google

nav:
  - Home: index.md
  - Architecture Refactor:
      - Overview: refactor/README.md
      - Redesign: refactor/ARCHITECTURE_REDESIGN.md
      - Current Issues: refactor/CURRENT_ISSUES.md
      - Implementation Checklist: refactor/IMPLEMENTATION_CHECKLIST.md
      - Testing Strategy: refactor/TESTING_STRATEGY.md
  - Quality Standards:
      - Testing Requirements: architecture/quality/testing-requirements.md
  - API Reference: reference/api.md
