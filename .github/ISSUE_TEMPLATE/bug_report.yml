name: 🐛 Bug Report
description: Something isn't working the way it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - PyInstaller standalone binary
        - uv/pip from PyPI
        - From source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PIIDigger version
      description: Output of `piidigger --version`, or the release/commit you're running
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact command line you ran
      render: shell
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant piidigger.toml config
      description: Paste any non-default config settings. Redact real file paths or anything sensitive.
      render: toml
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste any relevant console output, tracebacks, or log lines
      render: shell
    validations:
      required: false
