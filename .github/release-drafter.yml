name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug Fixes'
    labels: ['fix', 'bug']
  - title: '📚 Documentation'
    labels: ['docs', 'documentation']
  - title: '🧰 Maintenance'
    labels: ['chore', 'refactor', 'ci', 'dependencies']

autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\(.*\))?!?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.*\))?!?:/i'
  - label: 'docs'
    title:
      - '/^docs(\(.*\))?!?:/i'
  - label: 'chore'
    title:
      - '/^chore(\(.*\))?!?:/i'
  - label: 'refactor'
    title:
      - '/^refactor(\(.*\))?!?:/i'
  - label: 'ci'
    files:
      - '.github/workflows/**'
    title:
      - '/^ci(\(.*\))?!?:/i'

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: ['major']
  minor:
    labels: ['feature', 'enhancement']
  patch:
    labels: ['fix', 'bug', 'chore', 'docs', 'refactor', 'ci']
  default: patch

template: |
  ## Changes

  $CHANGES
