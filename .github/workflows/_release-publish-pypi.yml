name: Release - Publish to PyPI

# Called only from release.yml, after the release assets are attached and
# scanned; no workflow_dispatch, so nothing can publish without a release event.
# The tag check runs in _release-verify.yml before anything is built.
on:
  workflow_call:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    # No checkout and no run: steps; only the publish action sees the OIDC token.
    # python-dists comes from the `python` job in _release-build-standalone.yml,
    # so PyPI gets the same files that were smoke-tested and attached.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
