name: Run Python Tests
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -e .[dev,test]
      - name: Lint (ruff)
        run: python -m ruff check .
      # `ruff format --check` is intentionally deferred: the legacy tree is being
      # reformatted module-by-module as the queue refactor rewrites it, rather
      # than in one large churn. Re-enable once the tree is fully formatted.
      - name: Type check (mypy)
        run: python -m mypy src/piidigger
      - name: Run tests
        run: python -m pytest
