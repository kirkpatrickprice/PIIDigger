name: Release - Assets

on:
  workflow_call:
    inputs:
      artifact_base:
        description: piidigger-<version>-<commit>, or piidigger-<version>-dev-<commit> for a dry run
        required: true
        type: string
    outputs:
      dists_sha256:
        description: sha256sum lines for the wheel and sdist, as collect checksummed them
        value: ${{ jobs.collect.outputs.dists_sha256 }}

permissions: {}

# sbom and collect run on every event, so a dry run rehearses the SBOM and
# checksums too; publish runs on release events only.
jobs:
  # Read-only, and it never sees the build artifacts: `uv export` is third-party code.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a poisoned cache must not be able to reach the SBOM.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.6"
          enable-cache: false

      # The lock is universal, so one SBOM covers every platform's bundle. The
      # win and build extras add pywin32 and PyInstaller, which the bundles
      # carry; the dev, test, docs and pypi extras never ship.
      - name: Generate SBOM
        env:
          ARTIFACT_BASE: ${{ inputs.artifact_base }}
        run: >
          uv export --locked --no-dev --extra win --extra build --format cyclonedx1.5
          -o "$ARTIFACT_BASE-sbom.cdx.json"

      # Unzipped and named after the file, so collect's artifact_base-* pattern picks it up with the bundles.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: ${{ inputs.artifact_base }}-sbom.cdx.json
          if-no-files-found: error

  # Runs no third-party code, so the files it checksums are exactly the build
  # jobs' uploads: the same python-dists that _release-publish-pypi.yml sends to PyPI.
  collect:
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      dists_sha256: ${{ steps.dists.outputs.sha256 }}
    steps:
      # These artifacts are uploaded with archive: false, so each one is the release file itself.
      # skip-decompress keeps the Windows .zip as a file; by default download-artifact unpacks it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact_base }}-*
          path: assets
          merge-multiple: true
          skip-decompress: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dists
          path: py

      # The wheel and sdist checksums leave as a job output too: a later job in
      # the run can replace a workflow artifact, but not this job's outputs.
      # release.yml's check-dists compares python-dists against them before PyPI.
      - name: Record the wheel and sdist checksums
        id: dists
        run: |
          cd py
          {
            echo 'sha256<<EOF'
            sha256sum -- *
            echo EOF
          } >> "$GITHUB_OUTPUT"
          cp -- * ../assets/

      # 4 standalone bundles, the wheel, the sdist and the SBOM.
      - name: Generate checksums
        run: |
          cd assets
          count="$(find . -maxdepth 1 -type f | wc -l)"
          if [ "$count" -ne 7 ]; then
            ls -l
            echo "::error::Expected 7 release files, found $count"
            exit 1
          fi
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error

  # Release events only. Holds the write and signing scopes, so it runs no
  # third-party code: coreutils, a first-party action and the preinstalled gh.
  publish:
    if: github.event_name == 'release'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload
      id-token: write # actions/attest gets a Sigstore signing certificate
      attestations: write # actions/attest stores the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - name: Verify checksums
        run: |
          cd assets
          sha256sum -c checksums.txt

      # One SLSA provenance attestation naming every file in checksums.txt.
      # Verify a download with: gh attestation verify <file> -R <owner>/<repo>
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: assets/checksums.txt

      # --clobber replaces same-named assets, so a re-run is safe.
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
