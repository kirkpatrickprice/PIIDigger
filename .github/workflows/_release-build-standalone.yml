name: Release - Build Standalone Binaries

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

# The build jobs run unlocked third-party code (pip installs, the manylinux
# image's tooling), so they get a read-only token and only upload workflow
# artifacts. The `attach` job alone holds contents: write, and it runs no
# third-party code: it uses `gh release upload`, preinstalled on every runner.
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || 'dev' }}
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # The build itself runs *inside* the manylinux2014 container (glibc 2.17)
      # via `docker run`, rather than as a job-level `container:`. GitHub's own
      # JS-based actions (checkout, upload-artifact, etc.) expect a modern
      # glibc/Node runtime that manylinux2014's CentOS-7 base doesn't reliably
      # provide, so only the actual build command executes inside the old
      # image — the same pattern cibuildwheel uses.
      # The image is pinned by digest because neither pinact nor Dependabot
      # sees a `docker run` image reference. To update it, take the `latest`
      # tag's manifest_digest from
      # https://quay.io/api/v1/repository/pypa/manylinux2014_x86_64/tag/?specificTag=latest
      - name: Build inside manylinux2014
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/io" -w /io \
            -e RELEASE_TAG \
            quay.io/pypa/manylinux2014_x86_64@sha256:dc58399aca4cfb0de257f92e2de71b4f8421e60cce8542fcd5e28df0c0760942 \
            bash /io/.github/scripts/build-linux-standalone.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piidigger-${{ steps.tag.outputs.tag }}-linux-x86_64-manylinux2014
          path: dist/piidigger-${{ steps.tag.outputs.tag }}-linux-x86_64-manylinux2014.tar.gz

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || 'dev' }}
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # .python-version pins only major.minor; check-latest resolves it to the
      # newest patch release instead of whatever the runner image has cached.
      # The resolved version is reused for the embedded Python download so the
      # venv's compiled packages match the bundled interpreter exactly.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup-python
        with:
          python-version-file: .python-version
          check-latest: true

      - name: Install and build
        env:
          PY_VERSION: ${{ steps.setup-python.outputs.python-version }}
        run: |
          python -m venv .venv
          .venv\Scripts\activate
          pip install -e .[win]
          .\.github\scripts\build-windows-embedded.ps1 -arch amd64 -pyVersion $env:PY_VERSION -venv .venv

      - name: Package artifact
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          Compress-Archive -Path dist\piidigger-amd64 -DestinationPath "dist\piidigger-$env:RELEASE_TAG-windows-amd64.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piidigger-${{ steps.tag.outputs.tag }}-windows-amd64
          path: dist/piidigger-${{ steps.tag.outputs.tag }}-windows-amd64.zip

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || 'dev' }}
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: python -m pip install .[build]

      # No -i icon flag here: the repo only ships a Windows .ico; PyInstaller
      # wants a .icns on macOS. Add one later if a signed/branded app bundle
      # is wanted.
      - name: Build standalone binary
        # Entry is the package's __main__.py: a repo-root piidigger.py shadows
        # the piidigger package during PyInstaller analysis.
        run: pyinstaller --onedir --distpath dist --name piidigger --collect-submodules wakepy src/piidigger/__main__.py

      # Unsigned/unnotarized build: macOS Gatekeeper will show an
      # "unidentified developer" warning. Code-signing needs a paid Apple
      # Developer account + notarization pipeline; documented as a known
      # limitation in docs/user-guides/installation.md instead.
      - name: Package artifact
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd dist
          tar -czf "piidigger-$RELEASE_TAG-macos-$ARCH.tar.gz" piidigger

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piidigger-${{ steps.tag.outputs.tag }}-macos-${{ matrix.arch }}
          path: dist/piidigger-${{ steps.tag.outputs.tag }}-macos-${{ matrix.arch }}.tar.gz

  # Runs only when every build succeeded, so a release never gets a partial set.
  attach:
    if: github.event_name == 'release'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: piidigger-${{ github.event.release.tag_name }}-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt

      # --clobber replaces same-named assets, so a re-run is safe.
      - name: Attach binaries and checksums to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
